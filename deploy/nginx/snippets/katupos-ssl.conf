# Certificado comodín *.katupos.com (Let's Encrypt, validación por DNS de Linode)
ssl_certificate     /etc/letsencrypt/live/katupos.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/katupos.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:katu_ssl:10m;
ssl_session_timeout 1d;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
