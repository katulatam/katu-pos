# Balanceador de Katú POS — nginx en el servidor nuevo de balanceo.
#   www.katupos.com / katupos.com  → landing estática
#   *.katupos.com (app, orbita, …)  → los dos contenedores de la app (app1 y app2)
# Servidores de la app por la VPC katupos-vpc: app1 = 10.0.0.3, app2 = 10.0.0.4

upstream katupos_app {
    least_conn;
    server 10.0.0.3:3008 max_fails=3 fail_timeout=15s;
    server 10.0.0.4:3008 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

map $http_upgrade $conexion_upgrade { default upgrade; '' close; }

# Límites básicos contra abuso (ingreso, registro y webhooks públicos)
limit_req_zone $binary_remote_addr zone=katu_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=katu_api:10m rate=30r/s;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name katupos.com *.katupos.com;
    location / { return 301 https://$host$request_uri; }
}

# Landing
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name katupos.com www.katupos.com;
    include /etc/nginx/snippets/katupos-ssl.conf;

    if ($host = katupos.com) { return 301 https://www.katupos.com$request_uri; }

    root /usr/share/nginx/landing;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ { expires 7d; add_header Cache-Control "public"; }
}

# App y subdominios de las empresas
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.katupos.com;
    include /etc/nginx/snippets/katupos-ssl.conf;

    client_max_body_size 20m;

    location ~ ^/api/v1/(auth/login|auth/olvide|registro/checkout) {
        limit_req zone=katu_auth burst=10 nodelay;
        include /etc/nginx/snippets/katupos-proxy.conf;
    }
    location / {
        limit_req zone=katu_api burst=60 nodelay;
        include /etc/nginx/snippets/katupos-proxy.conf;
    }
}
