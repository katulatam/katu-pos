# MongoDB ÁRBITRO (rs0) — va en katupos-lb. Solo vota para elegir al nodo principal;
# no guarda datos ni usuarios. Usa la misma clave compartida (keyfile) de los nodos con datos.
services:
  mongo:
    image: mongo:7.0
    container_name: katupos-mongo-arbitro
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "10.0.0.2:27017:27017"
    volumes:
      - /srv/katupos/mongo/data:/data/db
      - /srv/katupos/mongo/keyfile:/etc/mongo/keyfile:ro
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
