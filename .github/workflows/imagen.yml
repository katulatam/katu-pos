# Construye la imagen de Katú POS en cada push a main y la publica en el registro
# privado de GitHub (ghcr.io/katulatam/katu-pos). Los servidores solo la descargan:
# Portainer → Stack → "Pull and redeploy" (o "Re-pull image").
name: Imagen Docker

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'Dockerfile', '.dockerignore', '.github/workflows/imagen.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Las pruebas deben pasar antes de publicar la imagen
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/katulatam/katu-pos:latest
            ghcr.io/katulatam/katu-pos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
