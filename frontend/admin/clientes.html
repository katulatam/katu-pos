<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katú POS</title>
  <link rel="icon" href="../assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="pos-admin.css">
</head>
<body data-pagina="clientes">
<main class="content"></main>
<script src="../assets/js/motor.js"></script>
<script src="pos-admin.js"></script>
<script>
(async function () {
  if (!(await POS.listo)) return;

  document.querySelector('main').innerHTML = `<div class="head"><div><h1>Clientes</h1><p id="res"></p></div><div class="acts"><button class="btn p" id="nv"><i class="fa-solid fa-user-plus"></i> Nuevo cliente</button></div></div><div class="filtros"><div class="f g"><input class="in" id="q" placeholder="Nombre, documento o celular"></div><div class="f"><select class="in" id="or"><option value="nombre">Por nombre</option><option value="compras">Los que más compran</option><option value="puntos">Con más puntos</option><option value="reciente">Compra más reciente</option></select></div></div><div class="card"><div id="t"></div><div class="pag" id="pg"></div></div>`;
  let pagina = 1; const tipos = POS.pais.tiposDocumento;
  async function cargar() { const d = await datos(`/clientes?q=${encodeURIComponent($('q').value)}&orden=${$('or').value}&pagina=${pagina}`); if (!d) return; $('res').textContent = `${fnum(d.total)} clientes`; tabla($('t'), [{ t: 'Cliente', f: c => `<b>${esc(c.nombre)}</b><small>${esc([c.documento, c.telefono].filter(Boolean).join(' · '))}</small>` }, ...(POS.empresa.modulos.gamificacion ? [{ t: 'Nivel', f: c => `<span class="bd"><i class="fa-solid fa-circle" style="color:${esc(c.nivel.color)};font-size:8px"></i> ${esc(c.nivel.nombre)}</span>` }, { t: 'Puntos', n: 1, f: c => fnum(c.puntos) }, { t: 'Racha', n: 1, f: c => c.racha?.semanas || 0 }] : []), { t: 'Compras', n: 1, f: c => `${fnum(c.compras)}<small>${dinero(c.totalComprado)}</small>` }, { t: 'Última', f: c => c.ultimaCompra ? fecha(c.ultimaCompra, { dateStyle: 'medium' }) : '—' }, ...(POS.empresa.modulos.fiado ? [{ t: 'Debe', n: 1, f: c => c.deuda ? `<span class="baja">${dinero(c.deuda)}</span>` : '—' }] : []), { t: '', f: c => `${c.cuenta ? '<i class="fa-solid fa-mobile-screen" title="Usa la app" style="color:var(--primary)"></i> ' : ''}` }], d.items, { vacio: 'No hay clientes', icono: 'fa-users', clic: ficha }); const ps = Math.max(1, Math.ceil(d.total / 50)); $('pg').innerHTML = `Página ${pagina} de ${ps} <button class="btn sm" id="a" ${pagina <= 1 ? 'disabled' : ''}>Anterior</button><button class="btn sm" id="b" ${pagina >= ps ? 'disabled' : ''}>Siguiente</button>`; $('a').onclick = () => { pagina--; cargar(); }; $('b').onclick = () => { pagina++; cargar(); }; }
  function editar(c) { const m = modal({ titulo: c ? 'Editar cliente' : 'Nuevo cliente', html: '<div id="f"></div>', pie: '<button class="btn p" data-s>Guardar</button>' }); const f = formulario(m.q('#f'), [{ k: 'nombre', l: 'Nombre completo', w: 12, req: 1 }, { k: 'tipoDocumento', l: 'Tipo de documento', t: 'lista', op: tipos.map(t => [t.codigo, t.nombre]) }, { k: 'documento', l: 'Documento' }, { k: 'telefono', l: 'Celular' }, { k: 'correo', l: 'Correo' }, { k: 'cumple', l: 'Cumpleaños (MM-DD)' }, ...(POS.empresa.modulos.fiado ? [{ k: 'cupo', l: 'Cupo de fiado', t: 'dinero' }] : []), { k: 'aceptaDatos', l: 'Autoriza el tratamiento de datos', t: 'si', w: 12 }, ...(POS.empresa.modulos.marketing ? [{ k: 'marketing.whatsapp', l: 'Acepta promociones por WhatsApp', t: 'si' }, { k: 'marketing.correo', l: 'Acepta promociones por correo', t: 'si' }] : []), { k: 'activo', l: 'Activo', t: 'si', def: true }], c || {}); m.q('[data-s]').onclick = async () => { const o = f.validar(); if (!o) return; const r = await datos('/clientes' + (c ? '/' + c._id : ''), c ? 'PUT' : 'POST', o); if (r) { m.cerrar(); toast('Guardado'); cargar(); } }; }
  async function ficha(x) { const d = await datos('/clientes/' + x._id); if (!d) return; const c = d.cliente, j = d.juego; const m = modal({ clase: 'l', titulo: esc(c.nombre), html: `${POS.empresa.modulos.gamificacion ? `<div class="kpis" style="margin-bottom:16px"><div class="kpi"><div class="k">Nivel</div><div class="v" style="color:${esc(j.nivel.actual.color)}">${esc(j.nivel.actual.nombre)}</div><div class="s">${j.nivel.siguiente ? `faltan ${fnum(j.nivel.faltan)} para ${esc(j.nivel.siguiente.nombre)}` : 'Nivel máximo'}</div></div><div class="kpi"><div class="k">Puntos</div><div class="v">${fnum(c.puntos)}</div><div class="s">valen ${dinero(j.valorPuntos)}</div></div><div class="kpi"><div class="k">Racha</div><div class="v">${c.racha?.semanas || 0}</div><div class="s">mejor: ${c.racha?.mejor || 0} semanas</div></div></div>${j.insignias.length ? `<div class="chips" style="margin-bottom:16px">${j.insignias.map(i => `<span class="chip on"><i class="fa-solid ${esc(i.icono)}"></i> ${esc(i.nombre)}</span>`).join('')}</div>` : ''}` : ''}<div class="mitad"><div class="card"><header><h3>Compras</h3></header><div id="v"></div></div><div class="card"><header><h3>Puntos</h3></header><div id="p"></div></div></div>`, pie: `${POS.empresa.modulos.gamificacion && (POS.esSuper || POS.user.rol === 'admin') ? '<button class="btn" data-a>Ajustar puntos</button>' : ''}<button class="btn" data-q>Vincular app</button><button class="btn p" data-e>Editar</button>` }); tabla(m.q('#v'), [{ t: 'Venta', f: v => `<b>${esc(v.numero)}</b><small>${fecha(v.fecha)}</small>` }, { t: 'Total', n: 1, f: v => dinero(v.total) }], d.ventas, { vacio: 'Sin compras' }); tabla(m.q('#p'), [{ t: 'Detalle', f: p => `${esc(p.detalle)}<small>${fecha(p.createdAt)}</small>` }, { t: '', n: 1, f: p => `<span class="${p.puntos > 0 ? 'sube' : 'baja'}">${p.puntos > 0 ? '+' : ''}${p.puntos}</span>` }], d.puntos, { vacio: 'Sin movimientos' });
    m.q('[data-e]').onclick = () => { m.cerrar(); editar(c); };
    m.q('[data-q]').onclick = () => { const w = modal({ clase: 's', titulo: 'Vincular app', html: '<div id="f"></div>', pie: '<button class="btn p" data-s>Vincular</button>' }); const f = formulario(w.q('#f'), [{ k: 'codigo', l: 'Código del QR de la app (KC-…)', w: 12, req: 1, ayuda: 'Escanea el QR que el cliente muestra en su app' }]); w.q('[data-s]').onclick = async () => { const o = f.validar(); if (o && await datos(`/clientes/${c._id}/vincular-app`, 'POST', o)) { w.cerrar(); m.cerrar(); toast('App vinculada'); cargar(); } }; };
    m.q('[data-a]')?.addEventListener('click', () => { const w = modal({ clase: 's', titulo: 'Ajustar puntos', html: '<div id="f"></div>', pie: '<button class="btn p" data-s>Guardar</button>' }); const f = formulario(w.q('#f'), [{ k: 'puntos', l: 'Puntos (negativo para quitar)', t: 'numero', w: 12, req: 1 }, { k: 'motivo', l: 'Motivo', w: 12, req: 1 }]); w.q('[data-s]').onclick = async () => { const o = f.validar(); if (o && await datos(`/clientes/${c._id}/puntos`, 'POST', o)) { w.cerrar(); m.cerrar(); toast('Puntos actualizados'); cargar(); } }; }); }
  $('nv').onclick = () => editar(null); $('or').onchange = cargar; let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(() => { pagina = 1; cargar(); }, 250); }; cargar();
})();
</script>
</body>
</html>
