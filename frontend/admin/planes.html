<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katú POS</title>
  <link rel="icon" href="../assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="pos-admin.css">
</head>
<body data-pagina="planes">
<main class="content"></main>
<script src="../assets/js/motor.js"></script>
<script src="pos-admin.js"></script>
<script>
(async function () {
  if (!(await POS.listo)) return;
  const main = document.querySelector('main');
  const MOD = { facturacion: 'Facturación electrónica', fiado: 'Fiado', domicilios: 'Domicilios y tienda en línea', gamificacion: 'Gamificación', whatsapp: 'WhatsApp (bot + asesores)', kiosco: 'Autopago', marketing: 'Marketing' };
  const plata = (n, m) => `${m === 'USD' ? 'US$' : '$'} ${Number(n || 0).toLocaleString('es-CO')}`;
  const REG = { pendiente: ['Esperando pago', 'av'], pagado: ['Pagado, creando', 'az'], listo: ['Cuenta creada', 'ok'], error: ['Error', 'mal'], vencido: ['No pagó', ''] };
  main.innerHTML = `<div class="head"><div><h1>Planes y registros</h1><p>Los precios que ves aquí son los que cobra Stripe al suscribirse (no hace falta crearlos en el panel de Stripe). Un cambio aplica a las suscripciones nuevas; las existentes conservan su precio.</p></div><div class="acts"><button class="btn p" id="np"><i class="fa-solid fa-plus"></i> Nuevo plan</button></div></div>
    <div class="card" id="tp"></div>
    <div class="card"><header><h3>Registros desde la landing</h3><p>Cada suscripción pagada crea la empresa sola. Si alguna falla, revísala y reintenta.</p></header><div id="tr"></div></div>`;
  async function cargar() {
    const [ps, rs] = await Promise.all([datos('/cuenta/planes'), datos('/cuenta/registros')]);
    if (ps) tabla($('tp'), [{ t: 'Plan', f: p => `<b>${esc(p.nombre)}</b>${p.destacado ? ' <span class="bd vi">Destacado</span>' : ''}<small>${esc(p.codigo)}${p.activo ? '' : ' · inactivo'}</small>` }, { t: 'Mensual', n: 1, f: p => plata(p.precioMensual, p.moneda) }, { t: 'Anual', n: 1, f: p => plata(p.precioAnual, p.moneda) }, { t: 'Módulos', f: p => Object.entries(MOD).filter(([k]) => p.modulos?.[k]).map(([, t]) => `<span class="bd az">${t}</span>`).join(' ') }], ps, { clic: editar, vacio: 'Sin planes' });
    if (rs) tabla($('tr'), [{ t: 'Fecha', f: r => fecha(r.createdAt) }, { t: 'Negocio', f: r => `<b>${esc(r.negocio)}</b><small>${esc(r.subdominio)} · ${esc(r.pais)}</small>` }, { t: 'Contacto', f: r => `${esc(r.nombre)}<small>${esc(r.correo)}</small>` }, { t: 'Plan', f: r => r.tipo === 'prueba' ? `<span class="bd az">Prueba gratis</span><small>${esc(r.plan)}</small>` : `${esc(r.plan)} · ${esc(r.periodo)}` }, { t: 'Estado', f: r => `<span class="bd ${REG[r.estado][1]}">${REG[r.estado][0]}</span>${r.error ? `<small style="color:var(--danger)">${esc(r.error)}</small>` : ''}${r.estado === 'error' ? ` <button class="btn sm" data-re="${r._id}">Reintentar</button>` : ''}${r.estado === 'listo' ? ` <button class="btn sm" data-env="${r._id}"><i class="fa-solid fa-envelope"></i> Reenviar bienvenida</button>` : ''}` }], rs, { vacio: 'Aún no hay registros', icono: 'fa-user-plus' });
  }
  $('tr').addEventListener('click', async e => {
    const b = e.target.closest('[data-env]'); if (!b) return;
    const r = await datos(`/cuenta/registros/${b.dataset.env}/reenviar`, 'POST'); if (!r) return;
    const m = modal({ titulo: r.enviado ? 'Correo reenviado' : 'El correo no se pudo enviar', html: `${r.enviado ? '<p>Se envió un enlace nuevo para crear la contraseña (vence en 72 horas). Pide al cliente revisar también spam.</p>' : `<div class="aviso m">${esc(r.error || '')}</div>`}<div class="f" style="margin-top:12px"><label>Enlace para enviarlo por otro medio (WhatsApp)</label><input class="in" readonly value="${esc(r.activar)}" onclick="this.select()"></div>` });
  });
  $('tr').onclick = async e => { const b = e.target.closest('[data-re]'); if (b && await datos(`/cuenta/registros/${b.dataset.re}/reintentar`, 'POST')) { toast('Empresa creada'); cargar(); } };
  function editar(p = null) {
    const m = modal({ clase: 'l', titulo: p ? `Plan ${esc(p.nombre)}` : 'Nuevo plan', html: '<div id="f"></div>', pie: '<button class="btn p" data-s>Guardar</button>' });
    const f = formulario(m.q('#f'), [
      ...(p ? [] : [{ k: 'codigo', l: 'Código (sin espacios)', req: 1 }]), { k: 'nombre', l: 'Nombre', req: 1 }, { k: 'moneda', l: 'Moneda', t: 'lista', op: [['USD', 'Dólares (USD)'], ['COP', 'Pesos colombianos (COP)'], ['MXN', 'Pesos mexicanos (MXN)'], ['EUR', 'Euros (EUR)']] },
      { k: 'precioMensual', l: 'Precio mensual', t: 'numero', req: 1 }, { k: 'precioAnual', l: 'Precio anual', t: 'numero', req: 1 }, { k: 'diasPrueba', l: 'Días de prueba gratis', t: 'numero' }, { k: 'orden', l: 'Orden en la landing', t: 'numero' },
      { k: 'descripcion', l: 'Descripción corta', w: 12 }, { k: 'caracteristicas', l: 'Lo que incluye (una línea por punto)', t: 'area', w: 12 },
      { t: 'titulo', l: 'Módulos que se activan' }, ...Object.entries(MOD).map(([k, t]) => ({ k: 'modulos.' + k, l: t, t: 'si' })),
      { t: 'titulo', l: 'Publicación' }, { k: 'destacado', l: 'Destacado en la landing', t: 'si' }, { k: 'activo', l: 'Disponible para suscribirse', t: 'si', def: true },
    ], p ? { ...p, caracteristicas: (p.caracteristicas || []).join('\n') } : { moneda: 'USD', activo: true, diasPrueba: 0 });
    m.q('[data-s]').onclick = async () => {
      const o = f.validar(); if (!o) return;
      if (await datos(p ? `/cuenta/planes/${p._id}` : '/cuenta/planes', p ? 'PUT' : 'POST', o)) { m.cerrar(); toast('Plan guardado'); cargar(); }
    };
  }
  $('np').onclick = () => editar();
  cargar();
})();
</script>
</body>
</html>
