<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katú POS</title>
  <link rel="icon" href="../assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="pos-admin.css">
</head>
<body data-pagina="paises">
<main class="content"></main>
<script src="../assets/js/motor.js"></script>
<script src="pos-admin.js"></script>
<script>
(async function () {
  if (!(await POS.listo)) return;

  document.querySelector('main').innerHTML = `<div class="head"><div><h1>Países</h1><p>Moneda, decimales, zona horaria, impuestos, documentos, medios de pago y proveedor de facturación de cada país.</p></div><div class="acts"><button class="btn p" id="nv"><i class="fa-solid fa-plus"></i> Nuevo país</button></div></div><div class="card" id="t"></div>`;
  let provs = [];
  async function cargar() { const d = await datos('/paises'); if (!d) return; provs = d.proveedores; tabla($('t'), [{ t: 'País', f: p => `<b>${esc(p.nombre)}</b><small>${esc(p.codigo)}</small>` }, { t: 'Moneda', f: p => `${esc(p.moneda)}<small>${dinero(1234.5, p)}</small>` }, { t: 'Decimales', n: 1, f: p => p.decimales }, { t: 'Zona horaria', f: p => `${esc(p.zonaHoraria)}<small>${new Date().toLocaleTimeString(p.locale, { timeZone: p.zonaHoraria, hour: '2-digit', minute: '2-digit' })}</small>` }, { t: 'Impuestos', f: p => p.impuestos.map(i => `<span class="bd">${esc(i.nombre)}</span>`).join(' ') }, { t: 'Facturación', f: p => p.facturacion?.proveedor ? `<span class="bd ok">${esc(p.facturacion.entidad)}</span>` : `<span class="bd">${esc(p.facturacion?.entidad || '')} sin proveedor</span>` }, { t: 'Empresas', n: 1, f: p => p.empresas }, { t: '', f: p => si(p.activo) }], d.paises, { clic: editar }); }
  const ED = { impuestos: { t: 'Impuestos', c: [['codigo', 'Código'], ['nombre', 'Nombre'], ['tipo', 'Tipo (iva, inc, excluido…)'], ['pct', '%', 'number']] }, tiposDocumento: { t: 'Tipos de documento', c: [['codigo', 'Código fiscal'], ['nombre', 'Nombre']] }, mediosPago: { t: 'Medios de pago', c: [['codigo', 'Código'], ['nombre', 'Nombre'], ['tipo', 'Tipo', ['efectivo', 'qr', 'datafono', 'manual', 'fiado']], ['proveedor', 'Proveedor', ['', 'katupay_nequi', 'katupay_tarjeta']], ['icono', 'Ícono']] } };
  function editar(p) {
    const v = { impuestos: [], tiposDocumento: [], mediosPago: [], ...JSON.parse(JSON.stringify(p || {})) };
    const m = modal({ clase: 'l', titulo: p ? esc(p.nombre) : 'Nuevo país', html: '<div id="f"></div><div id="x"></div>', pie: '<button class="btn p" data-s>Guardar</button>' });
    const f = formulario(m.q('#f'), [{ k: 'codigo', l: 'Código ISO', w: 3, req: 1 }, { k: 'nombre', l: 'Nombre', w: 3, req: 1 }, { k: 'moneda', l: 'Moneda (ISO)', w: 3, req: 1 }, { k: 'simbolo', l: 'Símbolo', w: 3 }, { k: 'decimales', l: 'Decimales', t: 'numero', w: 3 }, { k: 'locale', l: 'Formato regional', w: 3, ph: 'es-CO' }, { k: 'redondeoEfectivo', l: 'Redondeo efectivo', t: 'numero', w: 3 }, { k: 'prefijoTelefono', l: 'Prefijo telefónico', w: 3 }, { k: 'zonaHoraria', l: 'Zona horaria principal', w: 4, req: 1 }, { k: 'zonas', l: 'Zonas permitidas (coma)', w: 8 }, { k: 'nombreIdFiscal', l: 'Identificación fiscal se llama', w: 4 }, { k: 'bil', l: 'Billetes (coma)', w: 4 }, { k: 'impuestoDefecto', l: 'Código del impuesto por defecto', w: 4 }, { k: 'consumidorFinal.nombre', l: 'Consumidor final: nombre', w: 4 }, { k: 'consumidorFinal.tipoDocumento', l: 'Tipo documento', w: 4 }, { k: 'consumidorFinal.documento', l: 'Documento', w: 4 }, { t: 'titulo', l: 'Facturación electrónica' }, { k: 'facturacion.proveedor', l: 'Proveedor', t: 'lista', w: 3, vacio: 'Sin proveedor', op: provs }, { k: 'facturacion.nombreDocumento', l: 'Documento', w: 3 }, { k: 'facturacion.entidad', l: 'Entidad', w: 3 }, { k: 'facturacion.codigoUnico', l: 'Código único', w: 3 }, { k: 'activo', l: 'Activo', t: 'si', def: true }], { ...v, zonas: (v.zonasHorarias || []).join(', '), bil: (v.billetes || []).join(', ') });
    if (p) f.campo('codigo').disabled = true;
    const X = m.q('#x'); const ver = () => { X.innerHTML = Object.entries(ED).map(([k, e]) => `<div class="sec" style="margin:18px 0 10px;padding-top:14px">${e.t} <button class="btn sm" type="button" data-n="${k}"><i class="fa-solid fa-plus"></i></button></div>${v[k].map((r, i) => `<div class="lin" style="grid-template-columns:repeat(${e.c.length},1fr) auto">${e.c.map(c => Array.isArray(c[2]) ? `<select class="in" data-k="${k}" data-i="${i}" data-c="${c[0]}">${c[2].map(o => `<option ${o === (r[c[0]] || '') ? 'selected' : ''}>${o}</option>`).join('')}</select>` : `<input class="in" placeholder="${c[1]}" type="${c[2] || 'text'}" data-k="${k}" data-i="${i}" data-c="${c[0]}" value="${esc(r[c[0]] ?? '')}">`).join('')}<button class="ib d" type="button" data-q="${k}|${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('')}`).join(''); };
    X.oninput = X.onchange = e => { const d = e.target.dataset; if (d.k) v[d.k][d.i][d.c] = e.target.type === 'number' ? Number(e.target.value) : e.target.value; };
    X.onclick = e => { const n = e.target.closest('[data-n]'), q = e.target.closest('[data-q]'); if (n) v[n.dataset.n].push({}); else if (q) { const [k, i] = q.dataset.q.split('|'); v[k].splice(Number(i), 1); } else return; ver(); }; ver();
    m.q('[data-s]').onclick = async () => { const o = f.validar(); if (!o) return; const ls = s => String(s).split(',').map(x => x.trim()).filter(Boolean); const b = { ...o, zonasHorarias: ls(o.zonas), billetes: ls(o.bil).map(Number), impuestos: v.impuestos, tiposDocumento: v.tiposDocumento, mediosPago: v.mediosPago }; delete b.zonas; delete b.bil; const r = await datos('/paises' + (p ? '/' + p._id : ''), p ? 'PUT' : 'POST', b); if (r) { m.cerrar(); toast('Guardado'); cargar(); } };
  }
  $('nv').onclick = () => editar(null); cargar();
})();
</script>
</body>
</html>
