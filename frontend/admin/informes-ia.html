<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katú POS</title>
  <link rel="icon" href="../assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="pos-admin.css">
  <style>
    .tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .tipo { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .15s; }
    .tipo:hover { border-color: var(--primary-vivo); transform: translateY(-2px); }
    .tipo i { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-light); color: var(--primary); font-size: 16px; }
    .tipo b { font-family: var(--titulo); font-size: 15px; } .tipo small { color: var(--muted); line-height: 1.45; }
    .preg { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .inf-cab { background: linear-gradient(120deg, #05C3DD, #7C6CFF); color: #fff; border-radius: 18px; padding: 22px; }
    .inf-cab small { opacity: .9; } .inf-cab h2 { margin: 6px 0 8px; font-family: var(--titulo); font-size: 22px; line-height: 1.25; color: #fff; } .inf-cab p { margin: 0; opacity: .95; line-height: 1.6; }
    .hall { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .hall div { border-radius: 14px; padding: 14px; border: 1px solid var(--border); background: var(--surface); }
    .hall div.alerta { border-left: 4px solid var(--warning); } .hall div.positivo { border-left: 4px solid var(--success); } .hall div.info { border-left: 4px solid var(--primary-vivo); }
    .hall b { display: block; margin-bottom: 4px; } .hall p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
    .acc { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); } .acc:last-child { border: 0; }
    .acc .n { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
    .acc p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
    @media print { .sidebar, .topbar, .no-imp, .barra-prueba { display: none !important; } .main { margin: 0 !important; } .content { padding: 0 !important; } }
  </style>
</head>
<body data-pagina="informes-ia">
<main class="content"></main>
<script src="../assets/js/motor.js"></script>
<script src="pos-admin.js"></script>
<script>
(async function () {
  if (!(await POS.listo)) return;
  const main = document.querySelector('main');
  const ADM = POS.user.rol === 'admin' || POS.esSuper;
  const DESC = {
    resumen: 'Cómo te fue: ventas, ticket, días y horas fuertes, utilidad y lo que más se vende.',
    inventario: 'Qué se va a agotar, qué se agotó y se vende, y qué está quieto en la bodega.',
    rentabilidad: 'Productos con pérdida o margen bajo, los que más dejan y el peso de los descuentos.',
    vencimientos: 'Lotes por vencer, plata en riesgo y promociones para moverlos.',
    clientes: 'Nuevos, recurrentes, frecuentes que dejaron de venir y campañas sugeridas.',
    equipo: 'Ventas por cajero, descuentos, anulaciones y diferencias en los arqueos.',
  };
  const EJEMPLOS = ['¿Qué productos debería poner en promoción esta semana?', '¿A qué hora necesito más personal en la caja?', '¿Por qué bajaron mis ventas?', '¿Qué debería pedirle al proveedor?'];
  const ENLACES = { inventario: [['reabastecer.html', 'Ver reabastecimiento', 'fa-truck']], vencimientos: [['marketing.html', 'Crear promoción del día', 'fa-bolt'], ['vencimientos.html', 'Ver vencimientos', 'fa-calendar-xmark']], clientes: [['marketing.html', 'Crear campaña', 'fa-bullhorn']], rentabilidad: [['productos.html', 'Ajustar precios y costos', 'fa-tags']], equipo: [['turnos.html', 'Ver turnos y arqueos', 'fa-cash-register']], resumen: [['reportes.html', 'Ver informes detallados', 'fa-chart-column']] };
  const D = await datos('/reportes/ia'); if (!D) return;
  const NOM = Object.fromEntries(D.tipos.map(t => [t.tipo, t]));

  main.innerHTML = `<div class="head"><div><h1><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--violeta)"></i> Informes con IA</h1><p>Katú analiza tus números y te dice qué está pasando y qué hacer. Los números los calcula el sistema; la IA los explica.</p></div>
    <div class="acts no-imp">${ADM ? `<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="sem" ${D.semanal ? 'checked' : ''}> Enviarme el resumen cada lunes por correo</label>` : ''}</div></div>
    ${D.disponible ? '' : '<div class="aviso m"><i class="fa-solid fa-triangle-exclamation"></i> Los informes con IA no están disponibles en este servidor (falta configurar la IA).</div>'}
    <div class="card no-imp"><div class="b">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>Elige un informe</b><div class="f" style="min-width:200px"><select class="in" id="per">${Object.entries(D.periodos).map(([k, t]) => `<option value="${k}" ${k === '7d' ? 'selected' : ''}>${t}</option>`).join('')}</select></div></div>
      <div class="tipos">${D.tipos.filter(t => t.tipo !== 'pregunta').map(t => `<button class="tipo" data-t="${t.tipo}"><i class="fa-solid ${t.icono}"></i><b>${esc(t.titulo)}</b><small>${esc(DESC[t.tipo] || '')}</small></button>`).join('')}</div>
      <div class="sec" style="margin-top:12px"><i class="fa-solid fa-comments" style="color:var(--violeta)"></i> Pregúntale a tus datos</div>
      <div class="preg"><input class="in" id="pq" maxlength="300" placeholder="Escribe tu pregunta sobre tu negocio…"><button class="btn p" id="pb"><i class="fa-solid fa-paper-plane"></i> Preguntar</button></div>
      <div class="chips" id="pe">${EJEMPLOS.map(x => `<button type="button" class="chip">${esc(x)}</button>`).join('')}</div>
      <small style="color:var(--muted)">Máximo ${D.limiteDiario} informes por día. A la IA no se le envían nombres ni teléfonos de tus clientes.</small>
    </div></div>
    <div id="res"></div>
    <div class="card no-imp"><header><h3>Informes recientes</h3></header><div id="rec"></div></div>`;

  const pintarRecientes = l => tabla($('rec'), [{ t: 'Informe', f: x => `<b>${esc(NOM[x.tipo]?.titulo || x.tipo)}</b>${x.origen === 'semanal' ? ' <span class="bd vi">Semanal</span>' : ''}<small>${esc(x.pregunta || x.analisis?.titular || '')}</small>` }, { t: 'Periodo', f: x => esc(D.periodos[x.periodo] || '') }, { t: 'Fecha', f: x => fecha(x.createdAt) }], l, { vacio: 'Aún no has generado informes', icono: 'fa-wand-magic-sparkles', clic: x => abrir(x._id) });
  pintarRecientes(D.recientes);

  const tablaDe = x => {
    const T = x.tablas || {}, cont = document.createElement('div');
    const sec = (titulo, cols, filas, vacio) => { if (!filas?.length) return; const c = document.createElement('div'); c.className = 'card'; c.innerHTML = `<header><h3>${titulo}</h3></header><div></div>`; tabla(c.lastChild, cols, filas, { vacio }); cont.append(c); };
    if (x.tipo === 'resumen') sec('Productos más vendidos', [{ t: 'Producto', f: p => esc(p.nombre) }, { t: 'Cantidad', n: 1, f: p => fnum(p.cantidad) }, { t: 'Total', n: 1, f: p => dinero(p.total) }], T.productos);
    if (x.tipo === 'inventario') { sec('Se van a agotar', [{ t: 'Producto', f: p => esc(p.nombre) }, { t: 'Disponible', n: 1, f: p => `${fnum(p.disponible)} ${esc(p.unidad)}` }, { t: 'Vende/día', n: 1, f: p => fnum(p.ritmo_dia) }, { t: 'Alcanza', n: 1, f: p => `${fnum(p.dias_cobertura)} días` }], T.porAgotar); sec('Agotados que se venden', [{ t: 'Producto', f: p => esc(p.nombre) }, { t: 'Vendía por día', n: 1, f: p => fnum(p.ritmo_dia) }], T.agotados); sec('Quietos (sin ventas en 30 días)', [{ t: 'Producto', f: p => esc(p.nombre) }, { t: 'Disponible', n: 1, f: p => `${fnum(p.disponible)} ${esc(p.unidad)}` }, { t: 'Plata quieta', n: 1, f: p => dinero(p.valor) }], T.quietos); }
    if (x.tipo === 'rentabilidad') { const c = [{ t: 'Producto', f: p => esc(p.nombre) }, { t: 'Margen', n: 1, f: p => `${p.margen}%` }, { t: 'Utilidad', n: 1, f: p => dinero(p.utilidad) }, { t: 'Ventas', n: 1, f: p => dinero(p.ventas) }]; sec('Con pérdida', c, T.perdida); sec('Margen bajo (menos de 10 %)', c, T.bajo); sec('Los que más utilidad dejan', c, T.mejores); }
    if (x.tipo === 'vencimientos') sec('Lotes por vencer', [{ t: 'Producto', f: p => esc(p.nombre) }, { t: 'Quedan', n: 1, f: p => `${fnum(p.restante)} ${esc(p.unidad)}` }, { t: 'Vence', f: p => `${esc(p.vence)}<small>${p.dias < 0 ? 'vencido' : `en ${p.dias} días`}</small>` }, { t: 'Riesgo', f: p => `<span class="bd ${{ alto: 'mal', medio: 'av', bajo: 'ok', vencido: 'mal' }[p.riesgo]}">${p.riesgo}</span>` }, { t: 'En riesgo', n: 1, f: p => dinero(p.valor) }], T.lotes);
    if (x.tipo === 'clientes') sec('Clientes frecuentes que dejaron de venir', [{ t: 'Cliente', f: p => esc(p.nombre) }, { t: 'Compras', n: 1, f: p => fnum(p.compras) }, { t: 'Total comprado', n: 1, f: p => dinero(p.totalComprado) }, { t: 'Última compra', f: p => fecha(p.ultimaCompra) }, { t: 'WhatsApp', f: p => p.whatsapp ? '<span class="bd ok">Acepta</span>' : '<span class="bd">No</span>' }], T.enRiesgo);
    if (x.tipo === 'equipo') sec('Por cajero', [{ t: 'Cajero', f: p => esc(p.nombre) }, { t: 'Ventas', n: 1, f: p => fnum(p.ventas) }, { t: 'Total', n: 1, f: p => dinero(p.total) }, { t: 'Ticket', n: 1, f: p => dinero(p.ticket) }, { t: 'Descuentos', n: 1, f: p => dinero(p.descuentos) }, { t: 'Anuladas', n: 1, f: p => fnum(p.anuladas) }, { t: 'Turnos con diferencia', n: 1, f: p => `${fnum(p.turnosConDiferencia)} / ${fnum(p.turnos)}` }], T.cajeros);
    return cont;
  };
  function pintar(x) {
    const a = x.analisis || {};
    $('res').innerHTML = `<div class="inf-cab"><small><i class="fa-solid fa-wand-magic-sparkles"></i> ${esc(NOM[x.tipo]?.titulo || '')} · ${esc(D.periodos[x.periodo] || '')}${x.desde ? ` (${esc(x.desde)} a ${esc(x.hasta)})` : ''}${x.pregunta ? ` · “${esc(x.pregunta)}”` : ''}</small><h2>${esc(a.titular || 'Informe')}</h2><p>${esc(a.resumen || '')}</p></div>
      ${a.hallazgos?.length ? `<div class="hall">${a.hallazgos.map(h => `<div class="${h.tipo}"><b><i class="fa-solid ${h.tipo === 'alerta' ? 'fa-triangle-exclamation' : h.tipo === 'positivo' ? 'fa-circle-check' : 'fa-circle-info'}"></i> ${esc(h.titulo)}</b><p>${esc(h.detalle)}</p></div>`).join('')}</div>` : ''}
      ${a.acciones?.length ? `<div class="card"><header><h3><i class="fa-solid fa-list-check" style="color:var(--primary)"></i> Qué te recomendamos hacer</h3></header><div class="b">${a.acciones.map((c, i) => `<div class="acc"><span class="n">${i + 1}</span><div><b>${esc(c.titulo)}</b> <span class="bd ${{ alta: 'mal', media: 'av', baja: '' }[c.prioridad]}">${esc(c.prioridad)}</span><p>${esc(c.detalle)}</p></div></div>`).join('')}<div class="no-imp" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${(ENLACES[x.tipo] || []).map(([h, t, ic]) => `<a class="btn sm" href="${h}"><i class="fa-solid ${ic}"></i> ${t}</a>`).join('')}</div></div></div>` : ''}
      <div id="tbl"></div>
      <div class="no-imp" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px">Generado ${fecha(x.createdAt)}${x.cache ? ' (guardado hace un rato)' : ''} ${x.tipo !== 'pregunta' ? '<button class="btn sm" id="regen"><i class="fa-solid fa-rotate"></i> Volver a generar</button>' : ''}<button class="btn sm" id="imp"><i class="fa-solid fa-print"></i> Imprimir o guardar PDF</button><span>La IA puede equivocarse al interpretar: revisa las cifras en las tablas.</span></div>`;
    $('tbl').append(tablaDe(x));
    $('imp').onclick = () => print();
    $('regen') && ($('regen').onclick = () => generar(x.tipo, { periodo: x.periodo, regenerar: true }));
    $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function generar(tipo, extra = {}) {
    if (!D.disponible) return toast('Los informes con IA no están disponibles', 'mal');
    $('res').innerHTML = `<div class="card"><div class="nada"><i class="fa-solid fa-wand-magic-sparkles fa-beat-fade" style="color:var(--violeta)"></i>Analizando tus datos… esto toma unos segundos.</div></div>`;
    const r = await datos('/reportes/ia', 'POST', { tipo, periodo: extra.periodo || $('per').value, ...extra });
    if (!r) { $('res').innerHTML = ''; return; }
    pintar(r);
    const l = await datos('/reportes/ia'); if (l) pintarRecientes(l.recientes);
  }
  async function abrir(id) { const x = await datos('/reportes/ia/' + id); if (x) pintar(x); }

  main.querySelector('.tipos').onclick = e => { const b = e.target.closest('[data-t]'); if (b) generar(b.dataset.t); };
  $('pb').onclick = () => { const q = $('pq').value.trim(); if (q.length < 8) return toast('Escribe tu pregunta', 'mal'); generar('pregunta', { pregunta: q }); };
  $('pq').onkeydown = e => { if (e.key === 'Enter') $('pb').click(); };
  $('pe').onclick = e => { const b = e.target.closest('.chip'); if (b) { $('pq').value = b.textContent; $('pb').click(); } };
  $('sem') && ($('sem').onchange = async () => { if (await datos('/reportes/ia/config', 'PUT', { semanal: $('sem').checked })) toast($('sem').checked ? 'Te enviaremos el resumen cada lunes' : 'Correo semanal desactivado'); });
  const id = new URLSearchParams(location.search).get('id'); if (id) abrir(id);
})();
</script>
</body>
</html>
